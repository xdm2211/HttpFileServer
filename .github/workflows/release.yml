name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require a version tag on main
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$env:GITHUB_SHA" "origin/main"
          if ($LASTEXITCODE -ne 0) {
            throw "Release tags must point to a commit that has already been merged into main."
          }

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Apply tag version to assembly
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(?<major>0|[1-9]\d*)\.(?<minor>0|[1-9]\d*)\.(?<patch>0|[1-9]\d*)$') {
            throw "Release tag must use semantic version format vMAJOR.MINOR.PATCH."
          }

          $version = "$($Matches.major).$($Matches.minor).$($Matches.patch)"
          $assemblyVersion = "$version.0"
          $assemblyInfo = "src/HttpFileServer/Properties/AssemblyInfo.cs"
          $content = Get-Content $assemblyInfo -Raw
          $content = $content -replace 'AssemblyVersion\("[^"]+"\)', "AssemblyVersion(`"$assemblyVersion`")"
          $content = $content -replace 'AssemblyFileVersion\("[^"]+"\)', "AssemblyFileVersion(`"$assemblyVersion`")"
          $content = $content -replace 'AssemblyInformationalVersion\("[^"]+"\)', "AssemblyInformationalVersion(`"$version`")"
          Set-Content $assemblyInfo $content -Encoding utf8NoBOM

      - name: Restore packages
        run: nuget restore src\HttpFileServer.sln -NonInteractive

      - name: Build
        run: msbuild src\HttpFileServer.sln /m /t:Rebuild /p:Configuration=Release "/p:Platform=Any CPU"

      - name: Package release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $archive = "artifacts/HttpFileServer-$env:GITHUB_REF_NAME-windows-anycpu.zip"
          Compress-Archive -Path "src/HttpFileServer/bin/Release/*" -DestinationPath $archive -Force
          $checksum = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$checksum *$(Split-Path -Leaf $archive)" | Set-Content "$archive.sha256" -NoNewline

      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v6
        with:
          name: HttpFileServer-${{ github.ref_name }}-windows-anycpu
          path: artifacts/
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = Get-ChildItem artifacts -File | ForEach-Object { $_.FullName }
          gh release view $tag --json id 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --clobber
          } else {
            gh release create $tag $assets --verify-tag --generate-notes --title $tag
          }
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release publishing failed."
          }

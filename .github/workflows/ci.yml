name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore packages
        run: nuget restore src\HttpFileServer.sln -NonInteractive

      - name: Build
        run: msbuild src\HttpFileServer.sln /m /t:Rebuild /p:Configuration=Release "/p:Platform=Any CPU"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: HttpFileServer-windows-anycpu
          path: src/HttpFileServer/bin/Release/
          if-no-files-found: error
          retention-days: 14
